<ngff-field-template [field]="$any(field())" [params]="params()">
  <ng-template>
    <input
      type="text"
      [field]="$any(field())"
      [attr.id]="params().id"
      [attr.placeholder]="params().placeholder"
      [attr.autocomplete]="params().autocomplete ?? 'noop'"
      [attr.size]="params().size"
      [class]="params().className"
    />
  </ng-template>
</ngff-field-template>
